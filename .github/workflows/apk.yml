name: APK Android

on:
  push:
    paths:
      - "jeu/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.4.1

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Godot et les modèles d'export
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Configurer le SDK Android et la clé de debug
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Exporter l'APK
        working-directory: jeu
        run: |
          mkdir -p ../build
          godot --headless --import || true
          godot --headless --export-debug "Android" ../build/undercity.apk
          ls -la ../build

      - name: Publier l'APK (release « prototype »)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete prototype --yes --cleanup-tag || true
          gh release create prototype build/undercity.apk --prerelease --target "$GITHUB_SHA" \
            --title "Prototype — $(date -u +%Y-%m-%d) — ${GITHUB_SHA::7}" \
            --notes "APK de test du prototype, construit depuis la branche ${GITHUB_REF_NAME}."
